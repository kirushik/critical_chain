version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  assignees:
  - kirushik
# The Playwright driver the specs launch (spec/support/playwright.rb); keep it
# in step with playwright-ruby-client in the Gemfile.
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  assignees:
  - kirushik
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  assignees:
  - kirushik
